<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&family=Zen+Dots&display=swap"
      rel="stylesheet"
    />
    <title>Star Wars Trivia</title>
  </head>
  <body>
    <div id="start-page">
      <h1>Star Wars Trivia</h1>
      <button id="start-btn">Start Quiz</button>
    </div>
    <div id="quiz-container" style="display: none">
      <h1 id="question">Loading...</h1>
      <div id="options"></div>
      <button id="submit-btn">Submit</button>
    </div>
    <div id="score-page" style="display: none">
      <h2 id="score-results">Quiz Complete</h2>
      <div id="answers"></div>
      <button id="restart-btn">Restart Quiz</button>
    </div>
    <script src="/dist/main.js"></script>
  </body>
</html>
